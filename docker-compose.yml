services:
  db:
    image: mysql:8.0
    container_name: university-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-university}
    ports:
      - "${MYSQL_PUBLISHED_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: university-app
    restart: unless-stopped
    ports:
      - "8801:8801"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-university}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      APP_HOST: 0.0.0.0
      APP_PORT: "8801"
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://127.0.0.1:8801,http://localhost:8801}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      ARCHIVE_STORAGE_DIR: /var/lib/wolin-archives
      MAX_ARCHIVE_FILE_MB: ${MAX_ARCHIVE_FILE_MB:-20}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - archive_data:/var/lib/wolin-archives
      - knowledge_books_data:/app/data/knowledge_books
      - faiss_data:/app/data/faiss
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8801/pages/login', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql_data:
  archive_data:
  knowledge_books_data:
  faiss_data:
