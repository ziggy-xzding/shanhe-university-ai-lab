{% extends "base.html" %}
{% block title %}学院与专业课程{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4"><div><h3 class="mb-1">学院与专业课程</h3><div class="text-muted">按专业维护培养方案中的课程。学院管理员只能查看和调整本人学院专业。</div></div><a class="btn btn-outline-primary" href="/pages/university-dashboard">返回工作台</a></div>
<div class="row g-3 mb-3">
{% if principal.role == 'admin' %}
<div class="col-lg-4"><div class="card h-100"><div class="card-header">新增学院</div><div class="card-body"><form id="collegeForm" class="row g-2"><div class="col-12"><input class="form-control" name="code" placeholder="学院代码，如 CS" required></div><div class="col-12"><input class="form-control" name="name" placeholder="学院名称" required></div><div class="col-12"><button class="btn btn-outline-primary">新增学院</button></div></form></div></div></div>
{% endif %}
<div class="col-lg-{{ '8' if principal.role == 'admin' else '12' }}"><div class="card h-100"><div class="card-header">新增专业</div><div class="card-body"><form id="majorForm" class="row g-2"><div class="col-md-4"><select id="majorCollegeSelect" class="form-select" name="college_id" required></select></div><div class="col-md-3"><input class="form-control" name="code" placeholder="专业代码" required></div><div class="col-md-3"><input class="form-control" name="name" placeholder="专业名称" required></div><div class="col-md-2"><button class="btn btn-outline-primary w-100">新增专业</button></div></form></div></div></div>
</div>
<div class="row g-3"><div class="col-lg-4"><div class="card h-100"><div class="card-header">选择专业</div><div class="card-body"><label class="form-label">专业</label><select id="majorSelect" class="form-select"></select><div id="majorInfo" class="text-muted small mt-3"></div></div></div></div><div class="col-lg-8"><div class="card"><div class="card-header">专业课程清单</div><div class="card-body"><form id="curriculumForm" class="row g-2 align-items-end"><div class="col-md-7"><label class="form-label">从全校课程库添加</label><select id="courseSelect" class="form-select" required></select></div><div class="col-md-3"><label class="form-label">课程性质</label><select id="requiredSelect" class="form-select"><option value="true">必修</option><option value="false">选修</option></select></div><div class="col-md-2"><button class="btn btn-primary w-100">添加</button></div></form><div class="table-responsive mt-3"><table class="table table-hover mb-0"><thead><tr><th>课程代码</th><th>课程名称</th><th>学分</th><th>学时</th><th>性质</th><th>操作</th></tr></thead><tbody id="curriculumRows"></tbody></table></div></div></div></div></div>
<div id="curriculumNotice" class="alert d-none mt-3"></div>
{% endblock %}
{% block scripts %}
<script>
const majorSelect=document.getElementById('majorSelect'),majorCollegeSelect=document.getElementById('majorCollegeSelect'),courseSelect=document.getElementById('courseSelect'),curriculumRows=document.getElementById('curriculumRows'),notice=document.getElementById('curriculumNotice');
function show(message,type='danger'){notice.className=`alert alert-${type} mt-3`;notice.textContent=message;}
async function api(url,options){const response=await fetch(url,options);const data=response.status===204?null:await response.json();if(!response.ok)throw new Error(data?.detail||'操作失败');return data;}
function option(select,value,text){const node=document.createElement('option');node.value=value;node.textContent=text;select.append(node);}
async function loadCatalog(){const [colleges,majors,courses]=await Promise.all([api('/api/university/colleges'),api('/api/university/majors'),api('/api/university/courses')]);majorCollegeSelect.innerHTML='';majorSelect.innerHTML='';courseSelect.innerHTML='';colleges.items.forEach(item=>option(majorCollegeSelect,item.id,`${item.name} (${item.code})`));majors.items.forEach(item=>option(majorSelect,item.id,`${item.college_name} · ${item.name} (${item.code})`));courses.items.forEach(item=>option(courseSelect,item.id,`${item.code} · ${item.name} / ${item.credits} 学分`));if(!majors.items.length){show('当前账号没有可管理的专业。','info');return;}loadCurriculum();}
async function loadCurriculum(){const majorId=majorSelect.value;if(!majorId)return;const data=await api(`/api/university/majors/${majorId}/courses`);majorInfo.textContent=majorSelect.options[majorSelect.selectedIndex].textContent;curriculumRows.innerHTML='';data.items.forEach(item=>{const row=document.createElement('tr');[item.course_code,item.course_name,item.credits,item.hours,item.is_required?'必修':'选修'].forEach(value=>{const cell=document.createElement('td');cell.textContent=value;row.append(cell);});const action=document.createElement('td'),button=document.createElement('button');button.className='btn btn-sm btn-outline-danger';button.textContent='移除';button.onclick=async()=>{if(!confirm(`确认从本专业培养方案中移除「${item.course_name}」吗？`))return;try{await api(`/api/university/majors/${majorId}/courses/${item.course_id}`,{method:'DELETE'});show('课程已移除。','success');loadCurriculum();}catch(error){show(error.message);}};action.append(button);row.append(action);curriculumRows.append(row);});if(!data.items.length)curriculumRows.innerHTML='<tr><td colspan="6" class="text-center text-muted py-4">该专业暂未配置课程</td></tr>';}
majorSelect.onchange=()=>loadCurriculum().catch(error=>show(error.message));document.getElementById('curriculumForm').onsubmit=async event=>{event.preventDefault();try{await api(`/api/university/majors/${majorSelect.value}/courses`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({course_id:Number(courseSelect.value),is_required:requiredSelect.value==='true'})});show('课程已加入该专业培养方案。','success');loadCurriculum();}catch(error){show(error.message);}};document.getElementById('majorForm').onsubmit=async event=>{event.preventDefault();try{const data=Object.fromEntries(new FormData(event.currentTarget));data.college_id=Number(data.college_id);await api('/api/university/majors',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});event.currentTarget.reset();show('专业已创建。','success');loadCatalog();}catch(error){show(error.message);}};const collegeForm=document.getElementById('collegeForm');if(collegeForm)collegeForm.onsubmit=async event=>{event.preventDefault();try{const data=Object.fromEntries(new FormData(event.currentTarget));await api('/api/university/colleges',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});event.currentTarget.reset();show('学院已创建。','success');loadCatalog();}catch(error){show(error.message);}};loadCatalog().catch(error=>show(error.message));
</script>
{% endblock %}
