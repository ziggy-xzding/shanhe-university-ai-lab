{% extends "base.html" %}
{% block title %}教务管理{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div><h3 class="mb-1">教务管理</h3><div class="text-muted">维护课程、学期和教学班；每项均可随学院培养方案调整。</div></div>
  <a class="btn btn-outline-primary" href="/pages/university-dashboard">返回工作台</a>
</div>
<div class="row g-3">
  <div class="col-lg-4"><div class="card h-100"><div class="card-header">新增课程</div><div class="card-body"><form id="courseForm" class="vstack gap-2"><input class="form-control" name="code" placeholder="课程代码" required><input class="form-control" name="name" placeholder="课程名称" required><input class="form-control" type="number" name="credits" placeholder="学分" min="0" required><input class="form-control" type="number" name="hours" placeholder="学时" min="0" required><button class="btn btn-primary">保存课程</button></form></div></div></div>
  <div class="col-lg-4"><div class="card h-100"><div class="card-header">新增学期</div><div class="card-body"><form id="termForm" class="vstack gap-2"><input class="form-control" name="code" placeholder="学期代码，如 2027-2028-1" required><input class="form-control" name="name" placeholder="学期名称" required><input class="form-control" type="datetime-local" name="starts_at" required><input class="form-control" type="datetime-local" name="ends_at" required><button class="btn btn-primary">保存学期</button></form></div></div></div>
  <div class="col-lg-4"><div class="card h-100"><div class="card-header">新建教学班</div><div class="card-body"><form id="sectionForm" class="vstack gap-2"><div class="row g-2"><div class="col"><input class="form-control" type="number" name="course_id" placeholder="课程 ID" min="1" required></div><div class="col"><input class="form-control" type="number" name="academic_term_id" placeholder="学期 ID" min="1" required></div></div><div class="row g-2"><div class="col"><input class="form-control" type="number" name="teacher_id" placeholder="教师 ID（可选）" min="1"></div><div class="col"><input class="form-control" type="number" name="capacity" placeholder="容量" min="1" max="500" required></div></div><label class="form-label mb-0">选课开放时间</label><input class="form-control" type="datetime-local" name="selection_open_at" required><label class="form-label mb-0">选课截止时间</label><input class="form-control" type="datetime-local" name="selection_close_at" required><textarea class="form-control" name="timetable" rows="2" placeholder='课表 JSON，例如 [{"day":1,"start":"08:00","end":"09:40"}]'>[]</textarea><button class="btn btn-primary">创建教学班</button></form><div id="sectionSummary" class="text-muted mt-3">正在加载教学班…</div></div></div></div>
</div>
<div class="card mt-3" id="courseCatalog"><div class="card-header">课程目录</div><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>代码</th><th>名称</th><th>学分</th><th>学时</th><th>状态</th><th>操作</th></tr></thead><tbody id="courseRows"><tr><td colspan="6" class="text-center text-muted py-4">正在加载课程目录…</td></tr></tbody></table></div></div></div>
<div id="academicNotice" class="alert alert-info mt-4 d-none"></div>
{% endblock %}
{% block scripts %}
<script>
const notice = document.getElementById('academicNotice');
function show(message, type='info') { notice.className = `alert alert-${type} mt-4`; notice.textContent = message; }
async function submitForm(form, url) { const payload = Object.fromEntries(new FormData(form).entries()); for (const key of ['credits','hours']) if (payload[key] !== undefined) payload[key] = Number(payload[key]); for (const key of ['starts_at','ends_at']) if (payload[key]) payload[key] = new Date(payload[key]).toISOString(); const response = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)}); const data = await response.json(); if (!response.ok) throw new Error(data.detail || '保存失败'); form.reset(); show('已保存：' + (data.name || data.code), 'success'); }
document.getElementById('courseForm').addEventListener('submit', async e => { e.preventDefault(); try { await submitForm(e.currentTarget, '/api/university/courses'); loadCourseCatalog(); } catch (err) { show(err.message, 'danger'); } });
document.getElementById('termForm').addEventListener('submit', async e => { e.preventDefault(); try { await submitForm(e.currentTarget, '/api/university/terms'); } catch (err) { show(err.message, 'danger'); } });
document.getElementById('sectionForm').addEventListener('submit', async e => { e.preventDefault(); try { const form=e.currentTarget; const payload=Object.fromEntries(new FormData(form).entries()); for(const key of ['course_id','academic_term_id','capacity']) payload[key]=Number(payload[key]); payload.teacher_id=payload.teacher_id?Number(payload.teacher_id):null; payload.selection_open_at=new Date(payload.selection_open_at).toISOString(); payload.selection_close_at=new Date(payload.selection_close_at).toISOString(); payload.timetable=JSON.parse(payload.timetable||'[]'); const response=await fetch('/api/university/sections',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); const data=await response.json(); if(!response.ok) throw new Error(data.detail||'创建教学班失败'); form.reset(); form.querySelector('[name=timetable]').value='[]'; show(`教学班已创建：${data.id}`,'success'); loadSectionSummary(); } catch(err) { show(err.message==='Unexpected end of JSON input'?'课表格式必须是有效 JSON':err.message,'danger'); } });
async function loadSectionSummary(){try{const response=await fetch('/api/university/sections?management=true');const data=await response.json();if(!response.ok)throw new Error();document.getElementById('sectionSummary').textContent=`当前教学班：${data.items?.length ?? 0} 个`;}catch{document.getElementById('sectionSummary').textContent='教学班数据暂不可用';}}
async function loadCourseCatalog(){try{const response=await fetch('/api/university/courses?include_inactive=true');const data=await response.json();if(!response.ok)throw new Error(data.detail||'课程目录加载失败');const body=document.getElementById('courseRows');body.innerHTML='';data.items.forEach(course=>{const row=document.createElement('tr');[course.code,course.name,course.credits,course.hours,course.status==='active'?'启用':'停用'].forEach(value=>{const cell=document.createElement('td');cell.textContent=value;row.append(cell);});const actions=document.createElement('td');const edit=document.createElement('button');edit.className='btn btn-sm btn-outline-primary me-1';edit.textContent='编辑';edit.onclick=()=>editCourse(course);const toggle=document.createElement('button');toggle.className='btn btn-sm btn-outline-secondary';toggle.textContent=course.status==='active'?'停用':'启用';toggle.onclick=()=>updateCourse(course.id,{status:course.status==='active'?'inactive':'active'});actions.append(edit,toggle);row.append(actions);body.append(row);});if(!data.items.length)body.innerHTML='<tr><td colspan="6" class="text-center text-muted py-4">暂无课程</td></tr>';}catch(error){show(error.message,'danger');}}
async function updateCourse(courseId,payload){try{const response=await fetch(`/api/university/courses/${courseId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await response.json();if(!response.ok)throw new Error(data.detail||'课程更新失败');show('课程已更新：'+data.name,'success');loadCourseCatalog();}catch(error){show(error.message,'danger');}}
function editCourse(course){const name=prompt('课程名称',course.name);if(name===null)return;const credits=prompt('学分',course.credits);if(credits===null)return;const hours=prompt('学时',course.hours);if(hours===null)return;updateCourse(course.id,{name,credits:Number(credits),hours:Number(hours)});}
loadSectionSummary();
loadCourseCatalog();
</script>
{% endblock %}
