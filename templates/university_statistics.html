{% extends "base.html" %}
{% block title %}高校统计概览{% endblock %}
{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
  <div><h3 class="mb-1">高校统计概览</h3><div class="text-muted" id="statisticsScope">正在加载数据范围…</div></div>
  <div class="d-flex gap-2"><button id="expandAll" class="btn btn-outline-secondary" type="button"><i class="bi bi-arrows-expand me-1"></i>全部展开</button><button id="collapseAll" class="btn btn-outline-secondary" type="button"><i class="bi bi-arrows-collapse me-1"></i>全部收起</button><button id="refreshStatistics" class="btn btn-outline-primary" type="button"><i class="bi bi-arrow-clockwise me-1"></i>刷新数据</button></div>
</div>
<div class="row g-3"><div class="col-sm-6 col-xl-3"><div class="card stat-card border-primary"><div class="card-body"><div class="text-muted">在校学生</div><div class="display-6" id="studentCount">--</div></div></div></div><div class="col-sm-6 col-xl-3"><div class="card stat-card border-success"><div class="card-body"><div class="text-muted">有效课程</div><div class="display-6" id="courseCount">--</div></div></div></div><div class="col-sm-6 col-xl-3"><div class="card stat-card border-info"><div class="card-body"><div class="text-muted">开放教学班</div><div class="display-6" id="sectionCount">--</div></div></div></div><div class="col-sm-6 col-xl-3"><div class="card stat-card border-warning"><div class="card-body"><div class="text-muted">有效学期</div><div class="display-6" id="termCount">--</div></div></div></div></div>
<div id="statisticsNotice" class="alert d-none mt-3"></div>
<section class="card mt-4">
  <div class="card-header d-flex justify-content-between align-items-center"><div><strong>学院、专业与课程</strong><div class="text-muted small mt-1">展开学院查看专业，展开专业查看具体课程。</div></div><span class="text-muted small" id="hierarchySummary"></span></div>
  <div class="card-body"><div id="statisticsHierarchy" class="statistics-tree"><div class="text-center text-muted py-4">正在加载学院和课程…</div></div></div>
</section>
{% endblock %}
{% block scripts %}
<style>
.statistics-tree details{border:1px solid var(--bs-border-color);border-radius:.5rem;background:#fff}.statistics-tree details+details{margin-top:.75rem}.statistics-tree summary{display:flex;align-items:center;gap:.75rem;cursor:pointer;list-style:none;padding:1rem 1.1rem}.statistics-tree summary::-webkit-details-marker{display:none}.statistics-tree summary::before{content:'\F282';font-family:'bootstrap-icons';font-size:.9rem;color:var(--bs-secondary-color);transition:transform .15s ease}.statistics-tree details[open]>summary::before{transform:rotate(90deg)}.statistics-tree .tree-summary-main{min-width:0;flex:1}.statistics-tree .tree-summary-title{font-weight:600}.statistics-tree .tree-summary-meta{color:var(--bs-secondary-color);font-size:.875rem}.statistics-tree .tree-children{padding:0 1rem 1rem 2.5rem}.statistics-tree .major-details{background:#f8fafc}.statistics-tree .course-table{margin:0;border-top:1px solid var(--bs-border-color)}.statistics-tree .course-table th{font-size:.8rem;color:var(--bs-secondary-color);font-weight:600;white-space:nowrap}.statistics-tree .course-table td{vertical-align:middle}.statistics-tree .course-table td:nth-child(2){min-width:12rem}
</style>
<script>
const statisticsNotice=document.getElementById('statisticsNotice');
const hierarchy=document.getElementById('statisticsHierarchy');
function showStatisticsNotice(message,type='danger'){statisticsNotice.className=`alert alert-${type} mt-3`;statisticsNotice.textContent=message;}
function createSummary(title,meta,icon){const summary=document.createElement('summary');const iconNode=document.createElement('i');iconNode.className=`bi ${icon} text-primary`;const main=document.createElement('div');main.className='tree-summary-main';const titleNode=document.createElement('div');titleNode.className='tree-summary-title';titleNode.textContent=title;const metaNode=document.createElement('div');metaNode.className='tree-summary-meta';metaNode.textContent=meta;main.append(titleNode,metaNode);summary.append(iconNode,main);return summary;}
function createDetails(title,meta,icon,extraClass='',open=false){const details=document.createElement('details');details.className=extraClass;details.open=open;details.append(createSummary(title,meta,icon));const children=document.createElement('div');children.className='tree-children';details.append(children);return {details,children};}
function addCourseTable(container,courses){if(!courses.length){const empty=document.createElement('div');empty.className='text-muted small py-3';empty.textContent='该专业暂未配置课程。';container.append(empty);return;}const wrapper=document.createElement('div');wrapper.className='table-responsive';const table=document.createElement('table');table.className='table table-sm table-hover course-table';const head=document.createElement('thead');const headRow=document.createElement('tr');['课程代码','课程名称','学分','学时','课程性质','开放教学班'].forEach(label=>{const th=document.createElement('th');th.textContent=label;headRow.append(th);});head.append(headRow);const body=document.createElement('tbody');courses.forEach(course=>{const row=document.createElement('tr');[course.code,course.name,course.credits,course.hours,course.course_type||'未设置',course.open_section_count??0].forEach(value=>{const cell=document.createElement('td');cell.textContent=String(value);row.append(cell);});body.append(row);});table.append(head,body);wrapper.append(table);container.append(wrapper);}
function renderHierarchy(items){hierarchy.innerHTML='';if(!items.length){hierarchy.innerHTML='<div class="text-center text-muted py-4">暂无学院、专业或课程数据。</div>';document.getElementById('hierarchySummary').textContent='';return;}let majorTotal=0;let courseTotal=0;items.forEach(college=>{majorTotal+=college.major_count;const collegeDetails=createDetails(college.name,`${college.code} · ${college.student_count} 名学生 · ${college.major_count} 个专业`,'bi-building','college-details',true);college.majors.forEach(major=>{courseTotal+=major.course_count;const majorDetails=createDetails(major.name,`${major.code} · ${major.student_count} 名学生 · ${major.course_count} 门课程`,'bi-diagram-3','major-details',false);addCourseTable(majorDetails.children,major.courses);collegeDetails.children.append(majorDetails.details);});hierarchy.append(collegeDetails.details);});document.getElementById('hierarchySummary').textContent=`${items.length} 个学院 · ${majorTotal} 个专业 · ${courseTotal} 门专业课程`;}
async function loadStatistics(){try{const [overviewResponse,breakdownResponse]=await Promise.all([fetch('/api/university/statistics/overview'),fetch('/api/university/statistics/breakdown')]);const overview=await overviewResponse.json();const breakdown=await breakdownResponse.json();if(!overviewResponse.ok)throw new Error(overview.detail||'统计数据加载失败');if(!breakdownResponse.ok)throw new Error(breakdown.detail||'学院课程数据加载失败');document.getElementById('statisticsScope').textContent=overview.scope==='college'?`当前学院范围：${overview.college_name||'未命名学院'}`:'当前范围：全校';document.getElementById('studentCount').textContent=overview.student_count;document.getElementById('courseCount').textContent=overview.course_count;document.getElementById('sectionCount').textContent=overview.teaching_section_count;document.getElementById('termCount').textContent=overview.active_term_count;renderHierarchy(breakdown.items||[]);}catch(error){showStatisticsNotice(error.message);hierarchy.innerHTML='<div class="text-center text-danger py-4">数据加载失败，请刷新重试。</div>';}}
document.getElementById('expandAll').addEventListener('click',()=>hierarchy.querySelectorAll('details').forEach(item=>item.open=true));
document.getElementById('collapseAll').addEventListener('click',()=>hierarchy.querySelectorAll('details').forEach(item=>item.open=false));
document.getElementById('refreshStatistics').addEventListener('click',loadStatistics);
loadStatistics();
</script>
{% endblock %}
