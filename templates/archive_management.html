{% extends "base.html" %}
{% block title %}电子档案{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4"><div><h3 class="mb-1">电子档案</h3><div class="text-muted">官方档案仅允许归档、追加更正版本、授权和查阅审计；不支持覆盖原件。</div></div><a class="btn btn-outline-primary" href="/pages/university-dashboard">返回工作台</a></div>
<div class="row g-3 mb-3">
  <div class="col-lg-6"><div class="card h-100"><div class="card-header">上传官方档案</div><div class="card-body"><form id="archiveUploadForm" class="vstack gap-2"><div class="row g-2"><div class="col"><input class="form-control" name="student_no" placeholder="学生学号" required></div><div class="col"><input class="form-control" type="number" name="college_id" placeholder="学院 ID" min="1" required></div></div><input class="form-control" name="category" placeholder="档案类别，如学籍材料" required><input class="form-control" name="title" placeholder="档案标题" required><input class="form-control" type="file" name="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" required><div class="form-text">支持 PDF、Word、JPG、PNG，单个文件不超过 20 MB。上传后生成首个不可覆盖版本。</div><button class="btn btn-primary">归档上传</button></form></div></div></div>
  <div class="col-lg-6"><div class="card h-100"><div class="card-header">更正版本</div><div class="card-body"><form id="archiveCorrectionForm" class="vstack gap-2"><input class="form-control" type="number" name="document_id" placeholder="档案编号" min="1" required><textarea class="form-control" name="correction_reason" placeholder="更正原因（必填，将写入审计记录）" required></textarea><input class="form-control" type="file" name="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" required><button class="btn btn-outline-primary">追加更正版本</button></form></div></div></div>
  <div class="col-lg-6"><div class="card h-100"><div class="card-header">授权查阅</div><div class="card-body"><form id="archiveGrantForm" class="vstack gap-2"><input class="form-control" type="number" name="document_id" placeholder="档案编号" min="1" required><input class="form-control" name="grantee_staff_no" placeholder="被授权教职工工号" required><label class="form-label mb-0">有效期（留空表示长期有效）</label><input class="form-control" type="datetime-local" name="expires_at"><button class="btn btn-outline-primary">保存授权</button></form></div></div></div>
  <div class="col-lg-6"><div class="card h-100"><div class="card-header">撤销授权</div><div class="card-body"><form id="archiveRevokeForm" class="vstack gap-2"><input class="form-control" type="number" name="document_id" placeholder="档案编号" min="1" required><input class="form-control" name="grantee_staff_no" placeholder="被授权教职工工号" required><button class="btn btn-outline-danger">撤销授权</button></form></div></div></div>
</div>
<div class="card"><div class="card-header d-flex justify-content-between"><span>档案清单</span><button id="refreshArchives" class="btn btn-sm btn-outline-primary">刷新</button></div><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>编号</th><th>学生学号</th><th>类别</th><th>标题</th><th>状态</th><th>归档时间</th><th>操作</th></tr></thead><tbody id="archiveRows"><tr><td colspan="7" class="text-center text-muted py-4">正在加载…</td></tr></tbody></table></div></div></div>
<div class="card mt-3 d-none" id="archiveVersionsCard"><div class="card-header">档案版本与下载</div><div class="card-body" id="archiveVersions"></div></div>
<div id="archiveNotice" class="alert d-none mt-3"></div>
{% endblock %}
{% block scripts %}
<script>
const archiveRows=document.getElementById('archiveRows'); const archiveNotice=document.getElementById('archiveNotice');
function showArchiveNotice(message,type='info'){archiveNotice.className=`alert alert-${type} mt-3`;archiveNotice.textContent=message;}
async function archiveRequest(url, options={}){const response=await fetch(url,options);const data=response.headers.get('content-type')?.includes('application/json')?await response.json():null;if(!response.ok)throw new Error(data?.detail||'操作失败');return data;}
async function showVersions(documentId){try{const data=await archiveRequest(`/api/archives/documents/${documentId}`);const card=document.getElementById('archiveVersionsCard');const box=document.getElementById('archiveVersions');box.innerHTML='';const heading=document.createElement('div');heading.className='mb-2';heading.textContent=`${data.title}（档案编号 ${data.id}）`;box.append(heading);data.versions.forEach(version=>{const row=document.createElement('div');row.className='d-flex align-items-center gap-2 border-top py-2';const label=document.createElement('span');label.textContent=`V${version.version_no} · ${version.file_name} · ${version.archived_at||''}`;const link=document.createElement('a');link.className='btn btn-sm btn-outline-primary ms-auto';link.textContent='下载';link.href=`/api/archives/documents/${documentId}/versions/${version.version_no}/download`;row.append(label,link);box.append(row);});if(!data.versions.length)box.textContent='该档案尚无版本';card.classList.remove('d-none');}catch(error){showArchiveNotice(error.message,'danger');}}
async function loadArchives(){ try{ const data=await archiveRequest('/api/archives/documents?page_size=100'); archiveRows.innerHTML=''; if(!data.items.length){ archiveRows.innerHTML='<tr><td colspan="7" class="text-center text-muted py-4">暂无档案</td></tr>'; return; } data.items.forEach(item=>{const row=document.createElement('tr'); [item.id,item.student_no,item.category,item.title,item.status,item.created_at||''].forEach(value=>{const cell=document.createElement('td'); cell.textContent=value; row.append(cell);});const action=document.createElement('td');const button=document.createElement('button');button.className='btn btn-sm btn-outline-primary';button.textContent='查看版本';button.onclick=()=>showVersions(item.id);action.append(button);row.append(action);archiveRows.append(row);}); }catch(error){showArchiveNotice(error.message,'danger');} }
function bindArchiveForm(id, submit){const form=document.getElementById(id);form.addEventListener('submit',async event=>{event.preventDefault();try{await submit(new FormData(form));form.reset();showArchiveNotice('操作已保存','success');loadArchives();}catch(error){showArchiveNotice(error.message,'danger');}});}
bindArchiveForm('archiveUploadForm',form=>archiveRequest('/api/archives/documents',{method:'POST',body:form}));
bindArchiveForm('archiveCorrectionForm',form=>archiveRequest(`/api/archives/documents/${encodeURIComponent(form.get('document_id'))}/versions`,{method:'POST',body:form}));
bindArchiveForm('archiveGrantForm',form=>{const expiresAt=form.get('expires_at');return archiveRequest(`/api/archives/documents/${encodeURIComponent(form.get('document_id'))}/grants`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grantee_staff_no:form.get('grantee_staff_no'),expires_at:expiresAt?new Date(expiresAt).toISOString():null})});});
bindArchiveForm('archiveRevokeForm',form=>archiveRequest(`/api/archives/documents/${encodeURIComponent(form.get('document_id'))}/grants/${encodeURIComponent(form.get('grantee_staff_no'))}`,{method:'DELETE'}));
document.getElementById('refreshArchives').addEventListener('click',loadArchives); loadArchives();
</script>
{% endblock %}
