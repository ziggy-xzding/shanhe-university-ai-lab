{% extends "base.html" %}
{% block title %}投诉建议{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4"><div><h3 class="mb-1">投诉建议</h3><div class="text-muted">投诉可匿名提交；匿名追踪凭证只展示给提交人，请妥善保存。</div></div><a class="btn btn-outline-primary" href="/pages/university-dashboard">返回工作台</a></div>
{% if principal.role == 'student' %}
<div class="row g-3"><div class="col-lg-6"><div class="card h-100"><div class="card-header">匿名投诉</div><div class="card-body"><form id="complaintForm" class="vstack gap-2"><input class="form-control" name="category" placeholder="投诉类别，如教学、住宿、后勤" required><textarea class="form-control" name="content" rows="6" placeholder="请描述问题、时间和地点；避免填写不必要的个人隐私" required></textarea><div class="form-check"><input class="form-check-input" type="checkbox" id="anonymous" checked><label class="form-check-label" for="anonymous">匿名提交</label></div><button class="btn btn-primary">提交投诉</button></form><div id="submissionResult" class="alert alert-success d-none mt-3"></div></div></div></div><div class="col-lg-6"><div class="card h-100"><div class="card-header">匿名追踪</div><div class="card-body"><form id="trackingForm" class="vstack gap-2"><input class="form-control" name="tracking_token" placeholder="输入投诉追踪凭证" required><button class="btn btn-outline-primary">查询进度</button></form><div id="trackingResult" class="mt-3 text-muted">提交后可凭追踪凭证查询办理进度与最新回复。</div></div></div></div></div>
{% else %}
<div class="card"><div class="card-header d-flex justify-content-between"><span>投诉办理</span><button class="btn btn-sm btn-outline-primary" id="refreshComplaints">刷新</button></div><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>编号</th><th>类别</th><th>内容</th><th>状态</th><th>提交时间</th><th>操作</th></tr></thead><tbody id="complaintRows"><tr><td colspan="6" class="text-center text-muted py-4">正在加载…</td></tr></tbody></table></div></div></div>
{% endif %}
<div id="complaintNotice" class="alert d-none mt-3"></div>
{% endblock %}
{% block scripts %}
<script>
const complaintNotice=document.getElementById('complaintNotice');
function showNotice(message,type='info'){complaintNotice.className=`alert alert-${type} mt-3`;complaintNotice.textContent=message;}
async function complaintRequest(url,options={}){const response=await fetch(url,options);const data=await response.json();if(!response.ok)throw new Error(data.detail||'操作失败');return data;}
const complaintForm=document.getElementById('complaintForm');
if(complaintForm)complaintForm.addEventListener('submit',async event=>{event.preventDefault();try{const values=Object.fromEntries(new FormData(complaintForm).entries());values.anonymous=document.getElementById('anonymous').checked;const data=await complaintRequest('/api/complaints',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(values)});complaintForm.reset();document.getElementById('anonymous').checked=true;const result=document.getElementById('submissionResult');result.className='alert alert-success mt-3';result.textContent=`投诉已提交。请保存追踪凭证：${data.tracking_token}`;}catch(error){showNotice(error.message,'danger');}});
const trackingForm=document.getElementById('trackingForm');
if(trackingForm)trackingForm.addEventListener('submit',async event=>{event.preventDefault();try{const data=await complaintRequest(`/api/complaints/tracking/${encodeURIComponent(new FormData(trackingForm).get('tracking_token'))}`);const result=document.getElementById('trackingResult');result.className='mt-3';result.textContent=`编号 ${data.ticket_id}：${data.status}${data.latest_reply?`；最新回复：${data.latest_reply}`:''}`;}catch(error){showNotice(error.message,'danger');}});
async function loadComplaints(){const body=document.getElementById('complaintRows');if(!body)return;try{const data=await complaintRequest('/api/complaints?page_size=100');body.innerHTML='';data.items.forEach(item=>{const row=document.createElement('tr');[item.ticket_id,item.category,item.content,item.status,item.created_at||''].forEach(value=>{const cell=document.createElement('td');cell.textContent=value;row.append(cell);});const action=document.createElement('td');const button=document.createElement('button');button.className='btn btn-sm btn-outline-primary';button.textContent='办理';button.onclick=()=>processComplaint(item.ticket_id);action.append(button);row.append(action);body.append(row);});if(!body.children.length)body.innerHTML='<tr><td colspan="6" class="text-center text-muted py-4">暂无投诉</td></tr>';}catch(error){showNotice(error.message,'danger');}}
async function processComplaint(ticketId){const status=window.prompt('输入新状态：submitted、in_progress、resolved 或 closed','in_progress');if(!status)return;const comment=window.prompt('填写回复内容');if(!comment)return;try{await complaintRequest(`/api/complaints/${ticketId}/actions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,comment})});showNotice('投诉状态已更新','success');loadComplaints();}catch(error){showNotice(error.message,'danger');}}
document.getElementById('refreshComplaints')?.addEventListener('click',loadComplaints);loadComplaints();
</script>
{% endblock %}
