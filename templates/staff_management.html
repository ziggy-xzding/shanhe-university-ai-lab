{% extends "base.html" %}
{% block title %}教职工管理{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4"><div><h3 class="mb-1">教职工管理</h3><div class="text-muted">集中维护高校职员账号、角色与学院归属；停用账号会保留历史业务记录。</div></div><button class="btn btn-primary" id="createStaff">新增教职工</button></div>
<div class="card"><div class="card-body"><form id="staffSearch" class="row g-2"><div class="col-md-5"><input class="form-control" name="keyword" placeholder="工号、账号或姓名"></div><div class="col-md-2"><button class="btn btn-outline-primary w-100">查询</button></div></form></div></div>
<div class="card mt-3"><div class="card-header d-flex justify-content-between"><span>账号列表</span><span id="staffTotal" class="text-muted"></span></div><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>工号</th><th>姓名</th><th>角色</th><th>学院</th><th>岗位</th><th>状态</th><th>操作</th></tr></thead><tbody id="staffRows"></tbody></table></div></div>
<div class="d-flex justify-content-between align-items-center mt-3"><button class="btn btn-outline-secondary" id="previousPage">上一页</button><span id="pageInfo" class="text-muted"></span><button class="btn btn-outline-secondary" id="nextPage">下一页</button></div>
<div class="modal fade" id="staffModal" tabindex="-1"><div class="modal-dialog"><form class="modal-content" id="staffForm"><div class="modal-header"><h5 class="modal-title">教职工账号</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body row g-3"><input type="hidden" name="id"><div class="col-md-6"><label class="form-label">工号</label><input class="form-control" name="staff_no" required></div><div class="col-md-6"><label class="form-label">登录账号</label><input class="form-control" name="username" required></div><div class="col-md-6"><label class="form-label">姓名</label><input class="form-control" name="display_name" required></div><div class="col-md-6"><label class="form-label">角色</label><select class="form-select" name="role"><option value="teacher">教师</option><option value="counselor">辅导员</option><option value="student_affairs">学生事务</option><option value="academic_admin">教务管理员</option><option value="college_admin">学院管理员</option><option value="archive_admin">档案管理员</option><option value="staff">普通教职工</option><option value="admin">系统管理员</option></select></div><div class="col-md-6"><label class="form-label">学院（可选）</label><select class="form-select" id="collegeSelect" name="college_id"><option value="">未归属学院</option></select></div><div class="col-md-6"><label class="form-label">部门（可选）</label><select class="form-select" id="departmentSelect" name="department_id"><option value="">未归属部门</option></select></div><div class="col-md-6"><label class="form-label">岗位</label><input class="form-control" name="position"></div><div class="col-md-6"><label class="form-label">状态</label><select class="form-select" name="status"><option value="active">启用</option><option value="disabled">停用</option></select></div><div class="col-12" id="passwordField"><label class="form-label">初始密码</label><input class="form-control" type="password" name="password" value="Demo@123456"></div></div><div class="modal-footer"><button class="btn btn-primary">保存</button></div></form></div></div>
{% endblock %}
{% block scripts %}
<script>
const staffRows=document.getElementById('staffRows'),staffTotal=document.getElementById('staffTotal'),pageInfo=document.getElementById('pageInfo'),collegeSelect=document.getElementById('collegeSelect'),departmentSelect=document.getElementById('departmentSelect'),modal=new bootstrap.Modal('#staffModal');let currentPage=1,totalPages=1;
const roleNames={admin:'系统管理员',college_admin:'学院管理员',academic_admin:'教务管理员',student_affairs:'学生事务',counselor:'辅导员',teacher:'教师',archive_admin:'档案管理员',staff:'普通教职工'};
function assign(form,name,value){form.elements[name].value=value??'';}
async function loadStaff(){const keyword=new FormData(staffSearch).get('keyword'),query=new URLSearchParams({page:currentPage,page_size:20});if(keyword)query.set('keyword',keyword);const response=await fetch(`/api/admin/staff-accounts?${query}`),data=await response.json();if(!response.ok){alert(data.detail||'加载失败');return;}staffRows.innerHTML='';data.items.forEach(item=>{const row=document.createElement('tr');[item.staff_no,item.display_name,roleNames[item.role]||item.role,item.college_name||'',item.position||'',item.status==='active'?'启用':'停用'].forEach(value=>{const cell=document.createElement('td');cell.textContent=value;row.append(cell);});const actions=document.createElement('td'),edit=document.createElement('button');edit.className='btn btn-sm btn-outline-primary';edit.textContent='编辑';edit.onclick=()=>openEditor(item);actions.append(edit);row.append(actions);staffRows.append(row);});if(!data.items.length)staffRows.innerHTML='<tr><td colspan="7" class="text-center text-muted py-4">暂无数据</td></tr>';staffTotal.textContent=`共 ${data.total} 人`;totalPages=Math.max(1,Math.ceil(data.total/data.page_size));pageInfo.textContent=`第 ${data.page} / ${totalPages} 页`;previousPage.disabled=currentPage<=1;nextPage.disabled=currentPage>=totalPages;}
async function loadDepartments(){const response=await fetch('/api/university/departments');const data=await response.json();if(!response.ok)throw new Error(data.detail||'部门字典加载失败');departmentSelect.innerHTML='<option value="">未归属部门</option>';data.items.forEach(item=>{const option=document.createElement('option');option.value=item.id;option.textContent=`${item.dept_name} (${item.dept_no})`;departmentSelect.append(option);});}
async function loadColleges(){const response=await fetch('/api/university/colleges');const data=await response.json();if(!response.ok)throw new Error(data.detail||'学院字典加载失败');collegeSelect.innerHTML='<option value="">未归属学院</option>';data.items.forEach(item=>{const option=document.createElement('option');option.value=item.id;option.textContent=`${item.name} (${item.code})`;collegeSelect.append(option);});}
function openEditor(item){staffForm.reset();assign(staffForm,'id',item?.id);['staff_no','username','display_name','role','college_id','department_id','position','status'].forEach(name=>assign(staffForm,name,item?.[name]));staffForm.elements.staff_no.disabled=Boolean(item);staffForm.elements.username.disabled=Boolean(item);passwordField.classList.toggle('d-none',Boolean(item));modal.show();}
createStaff.onclick=()=>openEditor();staffSearch.onsubmit=e=>{e.preventDefault();currentPage=1;loadStaff();};previousPage.onclick=()=>{if(currentPage>1){currentPage--;loadStaff();}};nextPage.onclick=()=>{if(currentPage<totalPages){currentPage++;loadStaff();}};staffForm.onsubmit=async event=>{event.preventDefault();const data=Object.fromEntries(new FormData(staffForm)),id=data.id;delete data.id;['college_id','department_id'].forEach(key=>{if(data[key])data[key]=Number(data[key]);else delete data[key];});if(!data.position)delete data.position;if(id){delete data.staff_no;delete data.username;delete data.password;}const response=await fetch(id?`/api/admin/staff-accounts/${id}`:'/api/admin/staff-accounts',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!response.ok){const error=await response.json();alert(error.detail||'保存失败');return;}modal.hide();loadStaff();};Promise.all([loadColleges(),loadDepartments(),loadStaff()]).catch(error=>alert(error.message));
</script>
{% endblock %}
